[package]
name = "sagemaker-rust-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.6.20"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.19", features = ["http"] }


# Ecossistema Hugging Face Candle
candle-core = "0.6.0"
candle-transformers = "0.6.0"
candle-nn = "0.6.0"
# ATUALIZADO: Ativa o download direto do Hugging Face Hub via HTTP
#tokenizers = { version = "0.19", features = ["http"] }

# Força o ecossistema a usar estritamente a árvore do rand 0.8
rand = "=0.8.5"
rand_distr = "=0.4.3"

# Trava a versão do half e ativa as features necessárias para o Candle
half = { version = "=2.4.1", features = ["rand_distr", "num-traits"] }
